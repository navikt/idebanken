name: Frontend tests
on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Build app
    uses: ./.github/workflows/.test-node.yml
    permissions:
      contents: read
    with:
      working-directory: 'frontend'
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      