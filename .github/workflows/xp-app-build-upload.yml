name: Build XP app
run-name: Build XP "${{ github.ref_name }}" by @${{ github.actor }}

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      working_directory:
        type: string
        required: false
        default: "xp-backend"

jobs:
  deploy:
    name: 'Build XP'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 'Setup Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: 'Build XP app'
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version || github.ref_name }}
        run: ./gradlew -Pversion="${BUILD_VERSION#v}" build

      - name: 'Get safe working directory'
        id: safe
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          echo "working_directory=${WORKING_DIRECTORY//\//_}" >> "$GITHUB_OUTPUT"

      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.version || github.ref_name }}-${{ steps.safe.outputs.working_directory || inputs.working_directory }}
          path: ./${{ inputs.working_directory }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
